{% extends "base.html" %}
{% load static %}

{% block title %}Profile Setup{% endblock %}

{% block content %}

    <div class="flex-1 space-y-6">
        <header class="relative mb-8 py-4 px-6 md:py-5 md:px-8 rounded-3xl bg-gray-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-4 transition-all duration-300 group">
            
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-violet-500 dark:hover:bg-violet-800 text-slate-800 dark:text-white transition-all duration-300 hover:-translate-x-1 hover:shadow-md shrink-0" title="Go Back">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>

            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Profile</h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium mt-0.5 text-xs md:text-sm">Manage your personal information and account security.</p>
            </div>
            
        </header>

        <!-- Personal Info Card -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] shadow-xl overflow-hidden transition-all duration-300">
            <form id="profileForm">
                
                <div class="p-6 md:p-8 space-y-8">
                    <div class="flex items-center gap-3 border-b border-slate-100 dark:border-slate-800/60 pb-4">
                        <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center font-black">1</div>
                        <h3 class="text-sm font-black uppercase tracking-widest text-slate-800 dark:text-slate-200">Personal Information</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">First Name</label>
                            <input name="first_name" placeholder="First Name" class="text-slate-900 dark:text-white w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 p-3.5 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all shadow-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Middle Name</label>
                            <input name="middle_name" placeholder="Optional" class="text-slate-900 dark:text-white w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 p-3.5 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all shadow-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Last Name</label>
                            <input name="last_name" placeholder="Last Name" class="text-slate-900 dark:text-white w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 p-3.5 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all shadow-sm">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">User's Full Name</label>
                        <input name="display_name" placeholder="Auto-generated" disabled class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200/50 dark:border-slate-800 p-3.5 rounded-xl text-slate-800 dark:text-slate-300 cursor-not-allowed font-medium shadow-inner">
                    </div>

                    <!-- NEW: 3 Column Grid including Age -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Date of Birth</label>
                            <input id="dob" disabled class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200/50 dark:border-slate-800 p-3.5 rounded-xl text-slate-800 dark:text-slate-300 cursor-not-allowed font-medium shadow-inner">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Current Age</label>
                            <div class="relative">
                                <input id="age" disabled class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200/50 dark:border-slate-800 p-3.5 rounded-xl text-slate-800 dark:text-slate-300 cursor-not-allowed font-black shadow-inner">
                                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 uppercase tracking-widest">YRS</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Gender Identity</label>
                            <input id="gender" disabled class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200/50 dark:border-slate-800 p-3.5 rounded-xl text-slate-800 dark:text-slate-300 cursor-not-allowed font-medium shadow-inner capitalize">
                        </div>
                    </div>
                </div>

                <div class="p-6 md:p-8 bg-slate-50 dark:bg-slate-800/30 border-t border-slate-100 dark:border-slate-800/60">
                    <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg shadow-blue-500/30 transition-all hover:-translate-y-0.5 active:translate-y-0 active:scale-95">
                        Save Profile Updates
                    </button>
                </div>
            </form>
        </div>

        <!-- Security Card -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[2rem] shadow-xl overflow-hidden mt-8 transition-all duration-300">
            <div class="p-6 md:p-8 space-y-8">
                
                <div class="flex items-center gap-3 border-b border-slate-100 dark:border-slate-800/60 pb-4">
                    <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 flex items-center justify-center font-black">2</div>
                    <h3 class="text-sm font-black uppercase tracking-widest text-slate-800 dark:text-slate-200">Security & Authentication</h3>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <div class="space-y-4">
                        <div class="space-y-2 relative">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex justify-between items-center mb-1">
                                Email Address
                                <span id="email_verified" class="hidden"></span>
                            </label>
                            <input name="email" disabled class="w-full bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200/50 dark:border-slate-800 p-3.5 rounded-xl text-slate-800 dark:text-slate-300 cursor-not-allowed font-medium shadow-inner">
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Current Password</label>
                            <div class="relative">
                                <input id="old_password" type="password" placeholder="••••••••" class="text-slate-900 dark:text-white w-full pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 p-3.5 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all shadow-sm">
                                <button type="button" onclick="togglePasswordVisibility('old_password', this)" class="absolute inset-y-0 right-4 flex items-center text-slate-400 hover:text-blue-500 focus:outline-none transition-colors">
                                    <svg class="eye-open w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                    <svg class="eye-closed w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
                                </button>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">New Password</label>
                            <div class="relative">
                                <input id="new_password" type="password" placeholder="••••••••" class="text-slate-900 dark:text-white w-full pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 p-3.5 rounded-xl focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 outline-none transition-all shadow-sm">
                                <button type="button" onclick="togglePasswordVisibility('new_password', this)" class="absolute inset-y-0 right-4 flex items-center text-slate-400 hover:text-blue-500 focus:outline-none transition-colors">
                                    <svg class="eye-open w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                    <svg class="eye-closed w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
                                </button>
                            </div>
                            <!-- Strength Indicator -->
                            <div id="password-strength-container" class="hidden mt-3 space-y-2 px-1 animate-[fadeIn_0.5s_ease-out]">
                                <div class="flex gap-2 h-2 w-full rounded-full overflow-hidden">
                                    <div id="strength-bar-1" class="h-full w-1/4 bg-slate-200 dark:bg-slate-700 transition-colors duration-300"></div>
                                    <div id="strength-bar-2" class="h-full w-1/4 bg-slate-200 dark:bg-slate-700 transition-colors duration-300"></div>
                                    <div id="strength-bar-3" class="h-full w-1/4 bg-slate-200 dark:bg-slate-700 transition-colors duration-300"></div>
                                    <div id="strength-bar-4" class="h-full w-1/4 bg-slate-200 dark:bg-slate-700 transition-colors duration-300"></div>
                                </div>
                                <p id="strength-text" class="text-[10px] font-black uppercase tracking-widest text-right transition-colors duration-300"></p>
                            </div>
                        </div>
                        
                        <div class="pt-2">
                            <button type="button" onclick="changePassword()" class="w-full bg-white dark:bg-slate-800/50 border-2 border-red-200 dark:border-red-900/40 text-red-600 dark:text-red-400 font-bold py-3.5 px-6 rounded-xl transition-all hover:bg-red-50 dark:hover:bg-red-900/20 active:scale-95 shadow-sm">
                                Change Password
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
{% endblock %}

{% block extra_js %}
<script>
function setVerification(elId, isVerified) {
  const el = document.getElementById(elId);

  if (isVerified) {
    el.innerHTML = "✔ Verified Account";
    el.className = "text-[10px] font-black uppercase tracking-widest bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-lg border border-emerald-200 dark:border-emerald-800/50 shadow-sm";
  } else {
    el.innerHTML = "✖ Unverified";
    el.className = "text-[10px] font-black uppercase tracking-widest bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 px-3 py-1.5 rounded-lg border border-red-200 dark:border-red-800/50 shadow-sm";
  }

  el.classList.remove("hidden");
}

function updateDisplayName() {
  const first = document.querySelector('[name="first_name"]').value || "";
  const middle = document.querySelector('[name="middle_name"]').value || "";
  const last = document.querySelector('[name="last_name"]').value || "";

  const full = [first, middle, last].filter(Boolean).join(" ");
  document.querySelector('[name="display_name"]').value = full;
}

// Attach listeners
["first_name", "middle_name", "last_name"].forEach(name => {
  document.querySelector(`[name="${name}"]`)
    .addEventListener("input", updateDisplayName);
});

(async function(){  
  const { data } = await apiRequest("/api/user/profile/");

  if (data) {
    Object.keys(data).forEach(key => {
      const el = document.querySelector(`[name=${key}]`);
      if (el) el.value = data[key];
    });

    document.getElementById("dob").value = data.date_of_birth || '--';
    document.getElementById("age").value = data.age ? data.age : '--';
    document.getElementById("gender").value = data.gender || '--';

    setVerification("email_verified", data.is_email_verified);
  }
})();

// Update Profile
document.getElementById("profileForm").onsubmit = async function(e){
  e.preventDefault();
  const formData = new FormData(this);

  const { res } = await apiRequest(
    "/api/user/profile/",
    "PATCH",
    Object.fromEntries(formData)
  );

  if (res && res.ok) {
      if(typeof showToast === 'function') showToast("success", "Profile updated successfully.");
      else alert("Profile updated successfully.");
  } else {
      if(typeof showToast === 'function') showToast("error", "Failed to update profile.");
      else alert("Failed to update profile.");
  }
};

// Password Strength Logic
document.getElementById('new_password').addEventListener('input', function(e) {
    const val = e.target.value;
    const container = document.getElementById('password-strength-container');
    const text = document.getElementById('strength-text');
    const bars = [
        document.getElementById('strength-bar-1'),
        document.getElementById('strength-bar-2'),
        document.getElementById('strength-bar-3'),
        document.getElementById('strength-bar-4')
    ];

    if (!val) {
        container.classList.add('hidden');
        return;
    }
    
    container.classList.remove('hidden');

    let strength = 0;
    if (val.length >= 8) strength += 1;
    if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength += 1;
    if (val.match(/\d/)) strength += 1;
    if (val.match(/[^a-zA-Z\d]/)) strength += 1;

    bars.forEach(bar => bar.className = 'h-full w-1/4 bg-slate-200 dark:bg-slate-700 transition-colors duration-300');

    if (strength === 0 || strength === 1) {
        bars[0].classList.add('bg-red-500');
        bars[0].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        text.textContent = 'Weak';
        text.className = 'text-[10px] font-black uppercase tracking-widest text-right text-red-500';
    } else if (strength === 2) {
        bars[0].classList.add('bg-amber-400');
        bars[1].classList.add('bg-amber-400');
        bars[0].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        bars[1].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        text.textContent = 'Fair';
        text.className = 'text-[10px] font-black uppercase tracking-widest text-right text-amber-500';
    } else if (strength === 3) {
        bars[0].classList.add('bg-blue-500');
        bars[1].classList.add('bg-blue-500');
        bars[2].classList.add('bg-blue-500');
        bars[0].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        bars[1].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        bars[2].classList.remove('bg-slate-200', 'dark:bg-slate-700');
        text.textContent = 'Good';
        text.className = 'text-[10px] font-black uppercase tracking-widest text-right text-blue-600 dark:text-blue-400';
    } else if (strength === 4) {
        bars[0].classList.add('bg-emerald-500');
        bars[1].classList.add('bg-emerald-500');
        bars[2].classList.add('bg-emerald-500');
        bars[3].classList.add('bg-emerald-500');
        bars.forEach(bar => bar.classList.remove('bg-slate-200', 'dark:bg-slate-700'));
        text.textContent = 'Strong';
        text.className = 'text-[10px] font-black uppercase tracking-widest text-right text-emerald-600 dark:text-emerald-400';
    }
});

// Change Password
async function changePassword() {
  const old_password = document.getElementById("old_password").value;
  const new_password = document.getElementById("new_password").value;

  if (!old_password || !new_password) {
      if(typeof showToast === 'function') showToast("error", "Please fill in both password fields.");
      else alert("Please fill in both password fields.");
      return;
  }

  const { res, data } = await apiRequest(
    "/api/accounts/change-password/",
    "POST",
    { old_password, new_password }
  );

  if (res && res.ok) {
      document.getElementById("old_password").value = '';
      document.getElementById("new_password").value = '';
      document.getElementById('password-strength-container').classList.add('hidden');
  } 
};
</script>
{% endblock %}
