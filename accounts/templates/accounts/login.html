{% extends "public_base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
{% include "accounts/intro_header.html" %}
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
        from { width: 0; opacity: 0; }
        to { width: 2.5rem; opacity: 1; }
    }
    .animate-fade { animation: fadeIn 0.8s ease-out forwards; }
    .animate-card { animation: fadeIn 1.2s ease-out forwards; }
</style>
<div class="min-h-screen flex items-center justify-center bg-[#fbe519fb] px-6 py-12 relative overflow-hidden">
    
    <div class="absolute top-20 left-10 w-64 h-64 bg-amber-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-orange-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>

    <div class="relative w-full max-w-md">
        
        <div class="text-center mb-10 transition-all duration-700 ease-in-out">
            <h2 class="text-4xl font-serif font-bold text-blue-700 tracking-tight">Welcome Home 🏡</h2>
            <p class="text-amber-900 mt-3 text-base italic">Take a deep breath and step inside. 🍃🍂</p>
        </div>

        <div class="bg-white/60 backdrop-blur-md border border-white/40 shadow-2xl rounded-[2.5rem] p-8 md:p-10 transition-all">
            
            <div class="text-center mb-8 animate-[fadeIn_1s_ease-out]">
                <h1 class="text-2xl font-black tracking-[0.2em] text-blue-900/90 uppercase">
                    Login
                </h1>
                <div class="h-1.5 w-10 bg-amber-400/40 mx-auto mt-3 rounded-full shadow-sm animate-[scaleIn_1.2s_ease-out]"></div>
            </div>

            <div class="space-y-6">
                
                <div>
                    <label class="block text-xs font-bold text-blue-900 uppercase tracking-widest ml-1 mb-2">Email</label>
                    <input id="email" type="email" 
                        class="w-full px-6 py-4 bg-white/40 border border-stone-200/60 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:bg-white focus:border-transparent outline-none transition-all placeholder:text-stone-300" 
                        placeholder="hello@mentalhealth.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-900 uppercase tracking-widest ml-1 mb-2">Password</label>
                    <div class="relative">
                        <input id="password" type="password" 
                            class="w-full px-6 py-4 pr-12 bg-white/40 border border-stone-200/60 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:bg-white focus:border-transparent outline-none transition-all placeholder:text-stone-300" 
                            placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 right-4 flex items-center text-blue-900/40 hover:text-blue-900 focus:outline-none transition-colors">
                            <svg class="eye-open w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                            <svg class="eye-closed w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button onclick="location.href='/api/accounts/forgot/'" class="text-xs font-semibold text-amber-800/70 hover:text-amber-950 transition-colors">
                        Forgot password?
                    </button>
                </div>

                <button onclick="login()" 
                    class="w-full py-4 bg-blue-800 text-amber-50 rounded-2xl font-bold text-lg shadow-lg hover:bg-yellow-900 active:scale-[0.98] transition-all transform duration-200">
                    Enter Space
                </button>
            </div>

            <div class="mt-10 text-center">
                <p class="text-sm text-stone-500/80">
                    New here? 
                    <a href="/api/accounts/register-page/" class="font-bold text-stone-800 hover:underline decoration-amber-400/60 decoration-2 underline-offset-4">Join our community</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
if (window.location.pathname.includes("/login-page")) {
    localStorage.removeItem("access_exp");
}

async function login(){
const { res, data } = await apiRequest(
    "/api/accounts/login/",
    "POST",
    {
        email: email.value,
        password: password.value
    }
);

if(res.ok){
    localStorage.setItem("login", Date.now());
    localStorage.setItem("access", data.data.access)
    localStorage.setItem("refresh", data.data.refresh)
    
    const payload = JSON.parse(atob(data.data.access.split('.')[1]));
    localStorage.setItem("access_exp", payload.exp);
    
    location.href="/api/core/dashboard-page/"
}
}
</script>

{% endblock %}

{% comment %} <p id="message" class="text-red-500 text-center mt-4"></p> {% endcomment %}
