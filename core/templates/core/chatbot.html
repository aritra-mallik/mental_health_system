{% extends "base.html" %}
{% load static %}

{% block title %}Chat with Smera{% endblock %}

{% block content %}
<style>
    /* Hide global loader for the chat interface */
    #global-loader { display: none !important; }

    /* Clean Scrollbars */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
    
    #chatBox { scroll-behavior: smooth; }

    /* Subtle Fade In */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .msg-animate { animation: fadeIn 0.3s ease-out forwards; }

    /* GPT Style Typing Indicator */
    .typing-dot {
        width: 6px; height: 6px;
        background-color: currentColor;
        border-radius: 50%;
        display: inline-block;
        animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
    /* Gentle up and down floating motion */
    @keyframes smeraFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
    }
        
    /* Occasional natural blink */
    @keyframes smeraBlink {
        0%, 94%, 98%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
    }

    /* Subtle glowing/pulsing effect on the blush */
    @keyframes smeraBlush {
        0%, 100% { fill-opacity: 0.6; transform: scale(1); }
        50% { fill-opacity: 0.8; transform: scale(1.1); }
    }
    .Smera-float {
        animation: smeraFloat 4s ease-in-out infinite;
    }
    .smera-eye {
        animation: smeraBlink 5s infinite;
    }
    /* Transform origins must match the exact cx/cy coordinates to scale properly */
    .eye-left { transform-origin: 35px 45px; }
    .eye-right { transform-origin: 65px 45px; }
    .smera-cheek {
        animation: smeraBlush 4s ease-in-out infinite;
    }
    .cheek-left { transform-origin: 30px 55px; }
    .cheek-right { transform-origin: 70px 55px; }
</style>

<div class="flex h-[calc(100vh-80px)] mt-2 mx-auto max-w-screen-2xl bg-white dark:bg-[#111827] rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-800 shadow-sm relative">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden z-40 md:hidden transition-opacity"></div>

    <!-- COLLAPSIBLE SIDEBAR -->

        </header>

        <!-- Chat Output Container -->

            <!-- Messages go here -->

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden w-full max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center gap-4">
                
                <!-- Smera's Face Avatar -->
                <div class="w-8 h-8 rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 flex items-center justify-center shrink-0 overflow-hidden">
                    <svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <circle cx="35" cy="45" r="4" class="fill-blue-600"/>
                        <circle cx="65" cy="45" r="4" class="fill-blue-600"/>
                        <path d="M40 65C40 65 45 70 50 70C55 70 60 65 60 65" class="stroke-blue-600 dark:stroke-blue-400" stroke-width="3" stroke-linecap="round"/>

                </div>
                
                <!-- Thinking Text & Dots -->

                    Smera is thinking

        <!-- Input Area -->
        <div class="w-full pt-2 pb-6 px-4 bg-gradient-to-t from-white dark:from-[#111827] to-transparent">

                    <svg id="micOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 relative z-10">

{% block extra_js %}
<script>
let rawSession = sessionStorage.getItem("chat_session_id");
let sessionId = rawSession ? parseInt(rawSession) : null;

// --- NEW: Audio State Variables ---
let isVoiceMode = false;
let mediaRecorder = null;
let audioChunks = [];
let isListening = false;
let recordingInterval = null;
// ----------------------------------

if (isNaN(sessionId)) {
    sessionId = null;
    sessionStorage.removeItem("chat_session_id");
}

/* Layout & UI Toggles */
function toggleSidebar() {
    const sidebar = document.getElementById("chatSidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const isMobile = window.innerWidth < 768;
    
    if (isMobile) {
        // Mobile behavior: Slide in/out and toggle overlay
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
        
        // Ensure width is set for mobile when open
        if (!sidebar.classList.contains("-translate-x-full")) {
            sidebar.classList.remove("w-0", "border-none");
            sidebar.classList.add("w-72");
        }
    } else {
        // Desktop behavior: Collapse width to 0
        sidebar.classList.remove("-translate-x-full"); // Ensure it's not translated off-screen on desktop
        
        if (sidebar.classList.contains("w-72")) {
            sidebar.classList.remove("w-72");
            sidebar.classList.add("w-0", "border-none");
        } else {
            sidebar.classList.remove("w-0", "border-none");
            sidebar.classList.add("w-72");
        }
    }
}

// Initial setup to ensure sidebar is visible on desktop load
window.addEventListener('DOMContentLoaded', () => {
    if (window.innerWidth >= 768) {
        const sidebar = document.getElementById("chatSidebar");
        sidebar.classList.remove("-translate-x-full");
        sidebar.classList.add("md:relative"); // Add relative positioning for desktop
    }
});

// Handle resize events to reset sidebar state across breakpoints
window.addEventListener('resize', () => {
    const sidebar = document.getElementById("chatSidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const isMobile = window.innerWidth < 768;

    if (!isMobile) {
        overlay.classList.add("hidden");
        sidebar.classList.add("md:relative");
        
        if (!sidebar.classList.contains("w-0")) {
            sidebar.classList.remove("-translate-x-full");
        }
    } else {
        sidebar.classList.remove("md:relative");
        sidebar.classList.add("-translate-x-full");
        sidebar.classList.remove("w-0", "border-none");
        sidebar.classList.add("w-72");
        overlay.classList.add("hidden");
    }
});

/* Auto-resize textarea */
const tx = document.getElementById("chatInput");
tx.setAttribute("style", "height:" + (tx.scrollHeight) + "px;overflow-y:hidden;");
tx.addEventListener("input", OnInput, false);

function OnInput() {
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
    if (this.value === "") { this.style.height = "48px"; }
}

/* Enter to send, Shift+Enter for new line */
document.getElementById("chatInput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

function goDashboard(){
    window.location.href = "/api/core/dashboard-page/";
}

// PROFESSIONAL AUDIO QUEUE (Backend TTS)
let audioQueue = [];
let isPlayingAudio = false;
let currentAudio = null;

async function speak(text) {

    try {
        const response = await fetch('/api/core/chat/tts/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('access')}` 
            },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        
        if (data.audio_url) {
            audioQueue.push(data.audio_url);
            playNextAudio(); 
        }
    } catch (e) {
        console.error("Backend TTS fetch failed:", e);
    }
}

function playNextAudio() {
    if (isPlayingAudio || audioQueue.length === 0) return;

    isPlayingAudio = true;
    const nextAudioUrl = audioQueue.shift(); 
    
    currentAudio = new Audio(nextAudioUrl);
    
    currentAudio.onended = () => {
        isPlayingAudio = false;
        playNextAudio(); 
    };
    
    currentAudio.onerror = () => {
        isPlayingAudio = false;
        playNextAudio();
    };

    currentAudio.play().catch(e => {
        console.error("Browser blocked audio autoplay", e);
        isPlayingAudio = false;
        playNextAudio();
    });
}

function stopSpeaking() {
    audioQueue = []; 
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }
    isPlayingAudio = false;
}

// --- NEW: Speech-to-Text Recording Engine ---
async function toggleListening() {
    const micBtn = document.getElementById("micBtn");
    const micPulse = document.getElementById("micPulse");
    const micOffIcon = document.getElementById("micOffIcon");
    const micOnIcon = document.getElementById("micOnIcon");
    const chatInput = document.getElementById("chatInput");

    if (isListening) {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
        resetMicUI();
        return;
    }

    try {
        stopSpeaking(); 

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            stream.getTracks().forEach(track => track.stop()); 
            await processAudioRecording(audioBlob);
        };

        mediaRecorder.start();
        isListening = true;
        isVoiceMode = true; 

        // Icon & Button UI Update
        micBtn.classList.remove("bg-gray-100", "dark:bg-gray-700", "text-gray-600", "dark:text-gray-300");
        micBtn.classList.add("text-white", "bg-red-500", "hover:bg-red-600");
        micPulse.classList.remove("opacity-0");
        micPulse.classList.add("animate-ping", "opacity-50");
        micOffIcon.classList.add("hidden");
        micOnIcon.classList.remove("hidden");

        // Textarea "Listening..." Animation
        chatInput.disabled = true;
        let dots = ".";
        chatInput.value = "Listening" + dots;
        
        recordingInterval = setInterval(() => {
            dots += ".";
            if (dots.length > 3) dots = "."; // Reset after 3 dots
            chatInput.value = "Listening" + dots;
        }, 400);

    } catch (err) {
        console.error("Mic access denied", err);
        alert("Please allow microphone access to talk to Smera.");
    }
}

async function processAudioRecording(blob) {
    const chatInput = document.getElementById("chatInput");
    
    // Show transcribing state
    chatInput.value = "Transcribing...";
    chatInput.disabled = true;

    const formData = new FormData();
    formData.append('audio', blob, 'recording.webm');

    try {
        const response = await fetch('/api/core/chat/stt/', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('access')}` },
            body: formData
        });

        const data = await response.json();
        chatInput.disabled = false;

        if (data.text && data.text.trim().length > 0) {
            // Drop text into input for review, DO NOT AUTO-SEND!
            chatInput.value = data.text;
            chatInput.focus();
            
            // Adjust textarea height to fit the new text
            chatInput.style.height = "auto";
            chatInput.style.height = (chatInput.scrollHeight) + "px";
        } else {
            chatInput.value = "";
            appendMessage("bot", "I couldn't quite hear that. Could you try again?");
        }
    } catch (e) {
        chatInput.disabled = false;
        chatInput.value = "";
        console.error("STT failed", e);
        appendMessage("bot", "I had trouble processing that audio. Please try again.");
    }
}

function resetMicUI() {
    isListening = false;
    const micBtn = document.getElementById("micBtn");
    const micPulse = document.getElementById("micPulse");
    const micOffIcon = document.getElementById("micOffIcon");
    const micOnIcon = document.getElementById("micOnIcon");
    const chatInput = document.getElementById("chatInput");
    
    // Reset Icons & Button
    micBtn.classList.remove("text-white", "bg-red-500", "hover:bg-red-600");
    micBtn.classList.add("bg-gray-100", "dark:bg-gray-700", "text-gray-600", "dark:text-gray-300");
    micPulse.classList.remove("animate-ping", "opacity-50");
    micPulse.classList.add("opacity-0");
    micOffIcon.classList.remove("hidden");
    micOnIcon.classList.add("hidden");

    // Clear Animation
    clearInterval(recordingInterval);
    chatInput.disabled = false;
    chatInput.value = "";
}
// --------------------------------------------

async function sendMessage() {
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;

    const greeting = document.getElementById("defaultGreeting");
    if (greeting) greeting.remove();

    if (!sessionId || isNaN(sessionId)) {
        await initChat();
    }

    // Capture the current voice mode state for this specific message
    const useVoice = isVoiceMode;
    // Reset it for the next message (so typing normally won't trigger voice)
    isVoiceMode = false; 
    stopSpeaking(); 

    appendMessage("user", msg);
    input.value = "";
    input.style.height = "48px"; 
    
    showTyping(true);
    // Pass the voice flag directly
    await fetchBotReply(msg, useVoice);
}

// Helper function to hit the LLM and trigger TTS
async function fetchBotReply(messageText, useVoice = false) {
    if (!sessionId || isNaN(sessionId)) await initChat();

    try {
        const {data} = await apiRequest("/api/core/chat/message/", "POST", {
            session_id: sessionId,
            message: messageText
        });
        
        if (data.reply) {
            appendMessage("bot", data.reply, data.action_card);
            
            // Trigger TTS if this specific message was recorded via mic
            if (useVoice) {
                speak(data.reply); 
            }
        } else {
            showDefaultGreeting(); 
        }
        
        if (sessionId) await loadChatHistory();
        
    } catch (e) {
        appendMessage("bot", "I encountered an error connecting. Let's try that again.");
    } finally {
        showTyping(false);
    }
}

/* Chat Operations */
async function initChat(){
    if (sessionId && !isNaN(sessionId)) return; 

    try {
        const {data} = await apiRequest("/api/core/chat/session/", "POST");

        sessionId = data.session_id;

        //  persist session
        sessionStorage.setItem("chat_session_id", sessionId);

    } catch (e) { 
        console.error("Session failed", e); 
    }
}

async function togglePin(event, chatId) {
    // Prevent the click from bubbling up and switching the active session
    event.stopPropagation(); 
    try {
        await apiRequest(`/api/core/chat/session/${chatId}/pin/`, "POST");
        // Reloading history will automatically sort pinned items to the top based on your backend view
        loadChatHistory(); 
    } catch (e) {
        console.error("Pin failed", e);
    }
}

function speakTTS(buttonElement) {
    stopSpeaking(); 
    const text = decodeURIComponent(buttonElement.getAttribute("data-text"));
    speak(text);
}

async function loadChatHistory(){
    try {
        const {data} = await apiRequest("/api/core/chat/sessions/", "GET");
        const container = document.getElementById("chatHistorySidebar");
        container.innerHTML = "";
        data.forEach(session => {
            container.innerHTML += renderChatItem(session);
        });
    } catch (e) {
        console.error("History load failed", e);
    }
}

async function switchSession(id){
    sessionId = id;
    sessionStorage.setItem("chat_session_id", id);
    try {
        const {data} = await apiRequest(`/api/core/chat/session/${id}/`, "GET");
        const box = document.getElementById("chatBox");
        box.innerHTML = "";
        data.forEach(msg => { appendMessage(msg.role, msg.content); });
    } catch (e) {
        console.error("Failed to switch session", e);
    }
    loadChatHistory(); // Refreshes active state
    if (window.innerWidth < 768) toggleSidebar(); 
}

function searchChats() {
    const query = document.getElementById("chatSearchInput").value.toLowerCase();
    const items = document.querySelectorAll(".chat-item");
    items.forEach(item => {
        const title = item.querySelector(".chat-title").innerText.toLowerCase();
        item.style.display = title.includes(query) ? "flex" : "none";
    });
}

function createNewChat(){

    // clear active runtime session
    sessionId = null;

    // clear persisted session
    sessionStorage.removeItem("chat_session_id");

    // clear chat ui
    document.getElementById("chatBox").innerHTML = "";

    // show welcome screen
    showDefaultGreeting();

    // remove active state from sidebar items
    document.querySelectorAll(".chat-item").forEach(el => {
        el.classList.remove("bg-gray-200", "dark:bg-gray-800");
        el.classList.add("hover:bg-gray-100", "dark:hover:bg-gray-800");
    });

    // mobile close
    if (window.innerWidth < 768) {
        toggleSidebar();
    }
}

async function deleteChat(event, chatId) {
    event.stopPropagation();
    if (!confirm("Delete this conversation?")) return;
    try {
        await apiRequest(`/api/core/chat/session/${chatId}/delete/`, "DELETE");
        if (sessionId === chatId) {

            document.getElementById("chatBox").innerHTML = "";

            sessionId = null;

            sessionStorage.removeItem("chat_session_id");
            
            showDefaultGreeting(); 
        }
        loadChatHistory();
    } catch (e) {
        console.error("Delete failed", e);
    }
}

async function loadInitialMessage() {
    try {
        //  HARD STOP: no invalid calls
        if (!sessionId || isNaN(sessionId)) {
            showDefaultGreeting();
            return;
        }

        const { data } = await apiRequest(
            `/api/core/chat/initial/?session_id=${sessionId}`,
            "GET",
            null,
            { silent: true }
        );

        const box = document.getElementById("chatBox");

        if (box.children.length === 0 && data?.reply) {
            appendMessage("bot", data.reply);
        }

    } catch (e) {
        console.error("Initial message failed", e);
        showDefaultGreeting();
    }
}

async function initPage() {
    await loadChatHistory();

    if (sessionId && !isNaN(sessionId)) {
        try {
            // 1. Fetch the actual messages for the saved session
            const { data } = await apiRequest(`/api/core/chat/session/${sessionId}/`, "GET");
            const box = document.getElementById("chatBox");
            box.innerHTML = "";

            if (data && data.length > 0) {
                // 2. If the chat has history, render the messages!
                data.forEach(msg => { appendMessage(msg.role, msg.content); });
                
                // Refresh sidebar to ensure the active chat is highlighted
                loadChatHistory(); 
            } else {
                // 3. If the session is totally empty, check for a contextual greeting
                await loadInitialMessage();
            }

        // TO THIS:
        } catch (e) {
            console.error("Failed to restore session on reload", e);
            
            // Fallback if the session was deleted on another device or is invalid
            sessionId = null;
            sessionStorage.removeItem("chat_session_id");
            showDefaultGreeting();
        }
    } else {
        showDefaultGreeting();
    }
}

async function exportChatToPDF() {
    if (!sessionId) {
        if (typeof showToast === "function") showToast("warning", "Please select a chat session to export.");
        else alert("Please select a chat session to export.");
        return;
    }

    const exportBtn = document.getElementById("exportChatBtn");
    const originalHtml = exportBtn.innerHTML;
    
    exportBtn.innerHTML = `<svg class="animate-spin w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Exporting...`;
    exportBtn.disabled = true;

    try {
        const { data } = await apiRequest(`/api/core/chat/session/${sessionId}/`, "GET");
        
        if (!data || data.length === 0) {
            if (typeof showToast === "function") showToast("info", "This chat session is empty.");
            return;
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
            if (typeof showToast === "function") showToast("error", "Popup blocked! Please allow popups to export.");
            return;
        }

        const activeItem = document.querySelector(`.chat-item[data-session-id="${sessionId}"] .chat-title`);
        const chatTitle = activeItem ? activeItem.innerText : "Wellness Session";
        const exportDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        let messagesHtml = data.map(msg => {
            const isUser = msg.role === 'user';
            
            const safeContent = msg.content
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
                
            const formattedText = safeContent.replace(/\n/g, '<br>');
            
            if (isUser) {
                return `

                        <div style="width: 40px; height: 40px; border-radius: 50%; background-color: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">

                            ${formattedText}
                        </div>
                    </div>
                `;
            }
        }).join('');

        const html = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Smera Chat Export</title>
                <meta charset="utf-8">
                <style>
                    @media print {
                        @page { margin: 15mm; }
                        body { 
                            -webkit-print-color-adjust: exact !important; 
                            print-color-adjust: exact !important; 
                            background-color: white !important;
                        }
                    }
                    body { 
                        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

                        background: linear-gradient(135deg, #4f46e5, #3b82f6);

                </div>
                
                <script>
                    setTimeout(() => { window.print(); }, 800);
                <\\/script>
            </body>
            </html>
        `;

        const safeHtml = html.replace('<\\/script>', '<\/script>');
        printWindow.document.write(safeHtml);
        printWindow.document.close();

    } catch (e) {
        console.error(e);
        if (typeof showToast === "function") showToast("error", "Failed to export chat session.");
    } finally {
        exportBtn.innerHTML = originalHtml;
        exportBtn.disabled = false;
    }
}

initPage();
