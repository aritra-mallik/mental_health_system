{% extends "base.html" %}
{% load static %}

{% block title %}Live Consultation{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 h-[calc(100vh-80px)] flex flex-col">
    
    <!-- Top Control Bar -->
    <div class="flex justify-between items-center mb-4 shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-3">
                <span class="relative flex h-3.5 w-3.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-red-500"></span>
                </span>
                Secure Telehealth Session
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 font-medium">
                Counselor: <span id="counselorName" class="text-indigo-600 dark:text-indigo-400">Loading...</span>
            </p>
        </div>
        
        <a href="/api/core/dashboard-page/" class="px-5 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 dark:hover:text-red-400 hover:border-red-200 dark:hover:border-red-800/50 transition-all shadow-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Leave Safely
        </a>
    </div>

    <!-- Jitsi Video Container -->
    {% comment %} <div class="w-full flex-1 bg-gray-900 rounded-3xl overflow-hidden shadow-2xl relative border-2 border-gray-200 dark:border-gray-700">
        <!-- Loader that shows while Jitsi connects -->
        <div id="jitsi-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-10">
            <svg class="w-12 h-12 text-indigo-500 animate-spin mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-white font-medium animate-pulse">Establishing secure connection...</p>
        </div>
        
        <div id="jitsi-container" class="w-full h-full relative z-20 opacity-0 transition-opacity duration-700"></div>
    </div> {% endcomment %}
    <div class="w-full flex-1 bg-gray-900 rounded-3xl overflow-hidden shadow-2xl border-2 border-gray-200 dark:border-gray-700">
        
        <div id="jitsi-container" class="w-full h-full"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://meet.jit.si/external_api.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    // Django safely passes the ID from the URL into the script
    const bookingId = "{{ booking_id }}";

    try {
        // 1. SECURELY FETCH THE BOOKING USING YOUR JWT WRAPPER
        const { data } = await apiRequest(`/api/consultation/booking/${bookingId}/`);
        
        // 2. UPDATE THE UI
        document.getElementById('counselorName').innerText = data.counselor.name;
        const meetingUrl = data.meeting_link;

        if (!meetingUrl || meetingUrl === "None" || meetingUrl === "") {
            document.getElementById('jitsi-loader').innerHTML = `
                <h2 class="text-xl font-bold text-white">Invalid Meeting Link</h2>
                <p class="text-gray-400 mt-2">Please return to your dashboard.</p>
            `;
            return;
        }

        // 3. INITIALIZE JITSI
        const roomName = meetingUrl.split('/').pop();
        const options = {
            roomName: roomName,
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#jitsi-container'),
            // This bypasses strict browser hardware blocks
            allow: "camera; microphone; display-capture; autoplay; encrypted-media", 
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                //prejoinPageEnabled: false, 
                disableDeepLinking: true,  
            },
            interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                SHOW_WATERMARK_FOR_GUESTS: false,
            }
        };

        const api = new JitsiMeetExternalAPI('meet.jit.si', options);

        //api.addListener('videoConferenceJoined', () => {
        //   document.getElementById('jitsi-loader').style.display = 'none';
        //    document.getElementById('jitsi-container').classList.remove('opacity-0');
        //});

        api.addListener('videoConferenceLeft', () => {
            window.location.href = '/api/core/dashboard-page/';
        });

    } catch (error) {
        console.error("Authentication failed or booking not found:", error);
        document.getElementById('jitsi-loader').innerHTML = `
            <h2 class="text-xl font-bold text-red-500">Access Denied</h2>
            <p class="text-gray-400 mt-2">We could not verify your identity for this session.</p>
        `;
    }
});
</script>
{% endblock %}
