<style>
    /* 1. Wrap the collapsed state in a media query (lg: 1024px) */
    /* This ensures the sidebar NEVER collapses on mobile screens */
    @media (min-width: 1024px) {
        .sidebar-collapsed {
            width: 5.5rem !important;
        }

        .sidebar-collapsed .label {
            display: none;
        }

        .sidebar-collapsed #sidebarTitle {
            display: none;
        }
        
        .sidebar-collapsed .nav-item {
            justify-content: center !important;
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
        }
        
        .sidebar-collapsed .nav-icon-wrapper {
            margin: 0 !important;
            font-size: 1.8rem !important;
            transform: scale(1);
        }
    }

    /* 2. Keep animations and hover effects outside the media query 
          so they work smoothly on all screen sizes */
    .nav-icon-wrapper {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), font-size 0.3s ease-in-out, color 0.2s ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-item:hover .nav-icon-wrapper {
        transform: scale(1.25) translateY(-2px);
    }
</style>
